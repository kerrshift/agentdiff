name: Publish to PyPI

# Build and publish a release to PyPI whenever a version tag (`v*`) is pushed.
# Uses OpenID Connect trusted publishing — no PyPI API token is stored.
# After PyPI, publishes the `@kerrshift/agentdiff` npm launcher (npm/) at the
# same version, so `npx @kerrshift/agentdiff` resolves to the release just uploaded.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/agent-trajectory-diff
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-npm:
    name: Publish npm launcher
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NPM_VERSION=$(node -p "require('./npm/package.json').version")
          if [ "$TAG" != "$NPM_VERSION" ]; then
            echo "::error::npm/package.json is $NPM_VERSION but the tag is $TAG"
            exit 1
          fi

      - name: Test launcher
        working-directory: npm
        run: npm test

      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret is not set; skipping npm publish."
            exit 0
          fi
          npm publish --provenance --access public

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release + upload artifacts
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*