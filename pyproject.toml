[project]
name = "agentdiff"
version = "0.1.0"
description = "Deterministic agent trajectory diffing & evaluation tool"
readme = "README.md"
authors = [
    { name = "Sahil Gangurde", email = "sahilgangurde08@gmail.com" }
]
requires-python = ">=3.10"
license = { text = "Apache-2.0 OR MIT" }
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "typer>=0.9",
    "rich>=13.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
agentdiff = "agentdiff.cli:main"

[project.urls]
Homepage = "https://github.com/lostmartian/agentdiff"
Repository = "https://github.com/lostmartian/agentdiff"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentdiff"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
