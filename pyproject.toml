[project]
name = "agent-trajectory-diff"
description = "A developer-first package to evaluate and find regressions in agent trajectories"
readme = "README.md"
dynamic = ["version"]
authors = [
    { name = "Sahil Gangurde", email = "sahilgangurde08@gmail.com" }
]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "typer>=0.9",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
agentdiff = "agentdiff.cli:main"

[project.entry-points.pytest11]
agentdiff = "agentdiff.pytest_plugin"

[project.urls]
Homepage = "https://github.com/kerrshift/agentdiff"
Repository = "https://github.com/kerrshift/agentdiff"

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agentdiff/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentdiff"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-p pytester"
testpaths = ["tests"]
