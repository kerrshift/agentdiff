name = "agentdiff-token"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# Secrets (set via `wrangler secret put`, never in this file):
#   AGENTDIFF_APP_ID          - the AgentDiff GitHub App's numeric ID
#   AGENTDIFF_APP_PRIVATE_KEY - the App's PEM private key
#
# Optional vars (set in the Cloudflare dashboard or here):
#   AGENTDIFF_APP_SLUG - the App URL slug; SET THIS to "agentdiff-ci"
#   (the App is named AgentDiff CI because GitHub reserves "AgentDiff"
#   for the agentdiff repository in this account)
#
# [vars]
# AGENTDIFF_APP_SLUG = "agentdiff-ci"
